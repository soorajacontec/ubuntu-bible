<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a0b31"/><stop offset=".55" stop-color="#2a0823"/><stop offset="1" stop-color="#5e1a4f"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#E95420" stop-opacity=".45"/><stop offset="1" stop-color="#E95420" stop-opacity="0"/></radialGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7a3d"/><stop offset="1" stop-color="#c23d12"/></linearGradient>
    <linearGradient id="page" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#f3dccf"/><stop offset=".25" stop-color="#fff6ef"/><stop offset="1" stop-color="#fffaf6"/></linearGradient>
    <linearGradient id="page2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f3dccf"/><stop offset=".25" stop-color="#fff6ef"/><stop offset="1" stop-color="#fffaf6"/></linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 262) scale(.78) translate(-256 -262)">  <g>
