<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ubuntu Bible</title>
<meta name="description" content="Offline Ubuntu 26.04 LTS command reference with a simulated terminal playground.">
<meta name="theme-color" content="#1b0a17">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ubuntu Bible">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<script>try{var t=localStorage.getItem('ub-theme');if(t)document.documentElement.dataset.theme=t;else if(matchMedia('(prefers-color-scheme: light)').matches)document.documentElement.dataset.theme='light'}catch(e){}</script>
</head>
<body>
<div class="bg-grid" aria-hidden="true"></div>
<header class="top">
  <a class="brand" href="#" aria-label="Ubuntu Bible home">
    <img src="icons/icon.svg" alt="" width="34" height="34">
    <span class="bn"><span class="bt"><b>Ubuntu</b> Bible</span><small>26.04 LTS reference</small></span>
  </a>
  <div class="hbtns">
    <button class="hbtn" id="btnNotes" title="Notepad" aria-label="Open notepad">📝<span class="nbadge" hidden></span></button>
    <button class="hbtn" id="btnAbout" title="About" aria-label="About">✏️</button>
    <button class="hbtn" id="btnMusic" title="Ambient music (off)" aria-label="Toggle ambient music" aria-pressed="false">🎵</button>
    <button class="hbtn" id="btnTheme" title="Toggle theme" aria-label="Toggle dark or light theme">🌗</button>
  </div>
</header>
<nav class="bar">
  <div class="search">
    <span aria-hidden="true">⌕</span>
    <input id="q" type="search" placeholder="Search commands, flags, topics…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search">
  </div>
  <a class="tbtn" href="#terminal" id="navTerm" aria-label="Open terminal playground">&gt;_</a>
</nav>
<main id="view" tabindex="-1"></main>
<footer class="foot">
  <p><b>Created By SSK-BLUM</b></p>
  <p>Simulated output — nothing runs on your device. Ubuntu® is a registered trademark of Canonical Ltd. This is an unofficial reference.</p>
</footer>
<div id="scrim" class="scrim" hidden></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="js/core.js"></script>
<script src="js/tools.js"></script>
<script src="js/outputs.js"></script>
<script src="js/outputs2.js"></script>
<script src="js/data/d1.js"></script>
<script src="js/data/d2.js"></script>
<script src="js/data/d3.js"></script>
<script src="js/data/d4.js"></script>
<script src="js/data/d5.js"></script>
<script src="js/data/d6.js"></script>
<script src="js/data/d7.js"></script>
<script src="js/data/d8.js"></script>
<script src="js/data/d9.js"></script>
<script src="js/shell.js"></script>
<script src="js/app.js"></script>
<script src="js/cat.js"></script>
</body>
</html>
